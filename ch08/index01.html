<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 1. 태그 선택자 해당 페이지의 모든 p태그 선택됨.*/
      p {
        color: red;
      }

      /* 2. 아아디 선택자 */
      #temp-01 {
        color: blue;
        font-weight: bold;
      }

      /* 3. 클래스 선택자 */
      .temp-02 {
        color: green;
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <h2>CSS 선택자란</h2>
    <p>여기는 첫번째 p태그야</p>
    <p id="temp-01">여기는 두번째 p태그야</p>
    <p class="temp-02">여기는 세번째 p태그야</p>
    <p class="temp-02">여기는 네번째 p태그야</p>
  </body>
</html>
