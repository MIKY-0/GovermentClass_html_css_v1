<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto;
      }
      .container {
        width: 200px;
        height: 200px;
        background-color: aqua;
        border: 2px solid rgb(4, 230, 230);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item {
        background-color: beige;
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 5px 5px;
        border-radius: 16px;
        border: 2px solid bisque;
      }
      .item2 {
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background-color: beige;
        border-radius: 16px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="item">
        <div class="item2">itemchild</div>
      </div>
    </div>
  </body>
</html>
