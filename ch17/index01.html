<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 2px solid green;
        padding: 10px;
        display: flex;
        /* 규칙1. 부모 상자가 flex로 설정돼야함. --> 자식에 있는 item들은 flex가 됨.*/
        flex-direction: column;
      }
      .item {
        width: 100px;
        height: 100px;
        background-color: tomato;
        margin: 5px;
        text-align: center;
        color: white;
        border: 2px solid black;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
  </body>
</html>
