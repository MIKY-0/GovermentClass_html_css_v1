<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        background-color: gray;
      }
    </style>
  </head>

  <body>
    <h1>유저 전체 목록 조회</h1>
    <form action="http://localhost:8080/api/users" method="get">
      <button type="submit">전체 유저 조회</button>
    </form>

    <h1>유저 조회</h1>
    <form action="http://localhost:8080/api/users" method="get">
      <input type="text" name="id" placeholder="id입력" />
      <button type="submit">유저 검색</button>
    </form>

    <h1>유저 추가</h1>
    <form action="http://localhost:8080/api/users" method="post">
      <input type="text" name="id" placeholder="id 입력" />
      <button type="submit">유저 검색</button>
    </form>
  </body>
</html>
