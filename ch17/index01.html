<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        background-color: gray;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 600;
      }
      input {
        padding: 7px 5px;
        font-size: 20px;
      }
      p {
        font-size: 30px;
      }
      #s {
        color: rgb(128, 37, 37);
      }
      #c {
        color: rgb(35, 17, 138);
      }
    </style>
  </head>

  <body>
    <h1>유저 전체 목록 조회</h1>
    <form action="http://localhost:8080/api/users" method="get">
      <button type="submit">전체 유저 조회</button>
    </form>

    <p>==============================================</p>

    <h1 id="s">유저 조회</h1>
    <form action="http://localhost:8080/api/users" method="get">
      <input type="text" name="id" placeholder="id입력" />
      <button type="submit">유저 검색</button>
    </form>

    <p>==============================================</p>

    <h1 id="c">유저 등록</h1>
    <form action="http://localhost:8080/api/users" method="post">
      <input type="text" name="name" placeholder="이름 입력" />
      <br />
      <input type="email" name="email" placeholder="이메일 입력" />
      <button type="submit">유저 등록</button>
    </form>
  </body>
</html>
