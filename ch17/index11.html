<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        background-color: rgb(207, 204, 204);
        border: 1px solid;
        font-size: 15px;
        cursor: pointer;
      }
      button:hover {
        background-color: gray;
      }
      input {
        padding: 5px 5px;
      }
      #s {
        color: rgb(212, 32, 32);
      }
      #c {
        color: rgb(42, 42, 214);
      }
    </style>
  </head>

  <body>
    <h1>유저 전체 목록 조회</h1>
    <form action="http://localhost:8080/api/users" method="get">
      <button type="submit">유저 전체 목록 조회</button>
    </form>

    <p>===============================================================</p>

    <h1 id="s">유저 조회</h1>
    <form action="http://localhost:8080/api/users" method="get">
      <input type="text" name="id" placeholder="id입력" />
      <button type="submit">유저 검색</button>
    </form>

    <p>===============================================================</p>

    <h1 id="c">유저 추가</h1>
    <form action="http://localhost:8080/api/users" method="post">
      <input type="text" name="name" placeholder="이름 입력" />
      <br />
      <input type="email" name="email" placeholder="이메일 입력" />
      <button type="submit">유저 검색</button>
    </form>
  </body>
</html>
