<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 1. 버튼 요소에 마우스 오버 시 (hover) */
      button:hover {
        background-color: orange;
      }

      /* 2. 입력요소에 포커스시 */
      input:focus {
        border: 2px solid blue;
        color: red;
        outline: none; /* outline을 제거해야 border속성이 input 태그에서 적용됨. outline은 기본적으로 bordecolor가 검은색.*/
      }

      /* 3. 리스트의 첫번째 항목만 선택(first-child) */
      .item-list li:first-child {
        background-color: aqua;
      }

      /* 4. 리스트의 마지막 항목 (last-child) */
      .item-list li:last-child {
        background-color: yellow;
      }

      /* 5. 리스트 홀수(odd) / 짝수(even) / n(숫자) 사용 가능. */
      .item-list li:nth-child(odd) {
        font-size: 20px;
        font-weight: bold;
      }
      .item-list li:nth-child(even) {
        font-size: 10px;
        font-weight: bold;
      }
      .item-list li:nth-child(4) {
        font-size: 40px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <button>버튼을 눌러보세요</button>
    <input type="text" placeholder="여기에 입력" />

    <!-- 'ul.item-list>li*5' 와 같음 -->
    <ul class="item-list">
      <li>항목1</li>
      <li>항목2</li>
      <li>항목3</li>
      <li>항목4</li>
      <li>항목5</li>
    </ul>
  </body>
</html>
