<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .block {
        border-color: #ffccbc;
        border: 2px solid #333;
        padding: 10px;
        margin-bottom: 10px;
      }

      .inline {
        background-color: #c8e6c9;
        border: 2px solid #333;
        padding: 10px;
      }
    </style>
  </head>

  <body>
    <h1>문서 흐름 이해하기</h1>
    <h3>1. 블록 요소(수직으로 쌓임)</h3>
    <div class="block">블록 요소 1</div>
    <div class="block">블록 요소 2</div>
    <div class="block">블록 요소 3</div>

    <h3>2. 인라인 요소(수평으로 나란히 쌓임)</h3>
    <span class="inline">인라인 요소1</span>
    <span class="inline">인라인 요소2</span>
    <span class="inline">인라인 요소3</span>
  </body>
</html>
