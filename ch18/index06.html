<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        border: 2px solid green;
        padding: 10px;
        flex-wrap: wrap;
      }
      .item {
        width: 150px;
        height: 100px;
        background-color: blue;
        margin: 5px;
        border: 2px solid peachpuff;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
      }
      .item1 {
        /* flex 단축 속성  flex : [flex-grow} [felex-shrink] [flex-nasis]*/
        flex: 1 1 0;
      }
      .item2 {
        /* flex-grow = 1 , flex-shrink = 1 , flex-basis = 0 
        1 하나만 작성하면 위 값을 의미함.*/
        flex: 1;
      }
      .item3 {
        /* flex-grow = 2 , flex-shrink = 1 , flex-basis = 0 */
        flex: 2;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="item item1">1</div>
      <div class="item item2">2</div>
      <div class="item item3">3</div>
      <div class="item item3">3</div>
      <div class="item item3">3</div>
    </div>
  </body>
</html>
