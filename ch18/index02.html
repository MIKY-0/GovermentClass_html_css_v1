<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        display: flex;

        /* 단축 속성  flex - flow : [flex-direction] [flex-wrap] */
        flex-flow: row wrap;

        border: 2px solid green;
        padding: 10px;
        justify-content: space-between;
        align-items: center;
        height: 500px;
      }
      .item {
        width: 100px;
        height: 100px;
        background-color: greenyellow;
        margin: 5px;
        color: red;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
    </div>
  </body>
</html>
