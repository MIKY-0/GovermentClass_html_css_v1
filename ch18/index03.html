<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        border: 2px solid green;
        padding: 10px;
      }
      .item {
        width: 100px;
        height: 100px;
        background-color: gold;
        margin: 5px;
        border: 2px solid peachpuff;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
      }
      .item1 {
        flex-grow: 1;
      }
      .item2 {
        flex-grow: 3;
      }
      .item3 {
        flex-grow: 1;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="item item1">1</div>
      <div class="item item2">2</div>
      <div class="item item3">3</div>
    </div>
  </body>
</html>
