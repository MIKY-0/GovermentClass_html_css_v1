<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 자손 선택자 : h1 자손인 p태그를 선택한다. */
      /* h1의 자손은 현재 없는 상태임. */
      h1 p {
        color: green;
      }

      /* 인접 형제 선택자(h1과 가장 가까운 p) */
      h1 + p {
        color: red;
      }

      /* 일반 형제 선택자(h1밑에 오는 p들) */
      h1 ~ p {
        color: blue;
      }
    </style>
  </head>

  <body>
    <p>가나다라마바사</p>
    <h1>여기는 h1태그야</h1>
    <p>가나다라마바사</p>
    <p>가나다라마바사</p>
    <p>가나다라마바사</p>
    <p>가나다라마바사</p>

    <div>
      <p>123456</p>
    </div>
  </body>
</html>
