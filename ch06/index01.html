<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <!-- 1. h1 ~ h6 -->
    <h1>큰제목</h1>
    <h3>중간제목</h3>
    <h6>중간제목</h6>

    <!-- 2. p : 문단 -->
    <p>이것은 하나의 문단. 텍스트를 묶어줌.</p>

    <!-- 3. a : 링크 생성. href로 링크주소 주입. -->
    <a href="https://www.daum.net">여기를 클릭</a>

    <div>
      <!-- 4. img 태그 -->
      <img src="https://picsum.photos/id/7/100/100" alt="" />
    </div>

    <!-- 5. div : 콘텐츠를 구획으로 나누는 블록태그. -->
    <div>
      <p>이 문단은 div안에 있습니다.</p>
      <p>레이아웃을 나눌 때 유용합니다.</p>
    </div>

    <!-- 6. ul , li : 순서 없는 목록 -->
    <ul>
      <li>항목1</li>
      <li>항목2</li>
      <li>항목3</li>
    </ul>

    <!-- 7. ol , li : 순서 있는 목록 -->
    <ol>
      <li>첫번째 단계</li>
      <li>두번째 단계</li>
      <li>세번째 단계</li>
    </ol>

    <!-- 8. button -->
    <button>나를 눌러보세요</button>
  </body>
</html>
