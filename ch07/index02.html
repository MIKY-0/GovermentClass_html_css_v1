<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시멘틱 태그</title>
  </head>

  <body>
    <!-- 1. header : 페이지 상단 , 로고나 제목 포함. -->
    <header>
      <h1>나의 블로그</h1>
      <p>환영합니다. 다양한 주제를 다룹니다.</p>
    </header>

    <!-- 2. nav : 네비게이션 메뉴 -->
    <nav>
      <ul>
        <li><a href="">홈</a></li>
        <li><a href="">소개</a></li>
        <li><a href="">연락처</a></li>
      </ul>
    </nav>

    <!-- 3. section : 주제별 콘텐츠를 구분. -->
    <section>
      <h2>오늘의 포스트</h2>

      <!-- 4. article : 독립적인 콘텐츠 -->
      <article>
        <h3>HTML5란</h3>
        <p>HTML5는 웹의 표준으로 시멘틱 태그를 통해 구조를 명확히 함.</p>
      </article>
    </section>

    <!-- 5. aside : 부가적인 콘텐츠(사이드바) -->
    <aside>
      <h3>추천 링크</h3>
      <p><a href="https://www.naver.com">HTML배우기</a></p>
    </aside>

    <!-- 6. footer : 페이지 하단 , 저작권 정보 등 -->
    <footer>
      <p>&copy; 2026나의 블로그 All rights reserved.</p>
      <p>문의 : 1234-1234</p>
    </footer>
  </body>
</html>
