<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <!-- src 속성 -->
  <body>
    <img src="https://picsum.photos/id/20/200/200" alt="샘플 이미지" />

    <!-- href 속성 -->
    <p>
      <a href="https://www.google.com" target="_blank">내 포트폴리오 가기</a>
    </p>

    <!-- placeholder , maxlength 속성 -->
    <input type="text" placeholder="한 줄 소개를 입력하세요." maxlength="10" />

    <!-- disabled 속성 : 버튼 비활성화 -->
    <button disabled>아직 준비중</button>
  </body>
</html>
